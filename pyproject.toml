[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "centerline-flow-lab"
version = "0.1.4"
description = "One-pass FLUX.2 Klein inpainting with differentiable centerline/junction feedback and per-step inspection"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gradio>=5.35,<7",
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "scikit-image>=0.24,<1",
  "networkx>=3.2,<4",
  "pillow>=10,<13",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
models = [
  "torch>=2.7,<3",
  "torchvision>=0.22",
  "transformers>=5.0,<6",
  "accelerate>=1.5,<2",
  "safetensors>=0.5",
  "huggingface-hub>=0.33",
  "diffusers @ git+https://github.com/huggingface/diffusers.git@27a54904a7def137c98b6520141873d9a9b08adb",
]
dev = ["pytest>=8"]

[project.scripts]
centerline-lab = "centerline_lab.app:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/centerline_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
